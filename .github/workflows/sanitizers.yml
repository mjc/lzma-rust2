name: Sanitizers

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: ${{ matrix.sanitizer }} / ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: leak
            target: lzma2_mt_decode
            decoder_seed: true
          - sanitizer: leak
            target: xz_mt_decode
            decoder_seed: true
          - sanitizer: leak
            target: lzip_mt_decode
            decoder_seed: true
          - sanitizer: leak
            target: lzma2
            decoder_seed: true
          - sanitizer: leak
            target: xz
            decoder_seed: true
          - sanitizer: leak
            target: lzip
            decoder_seed: true
          - sanitizer: leak
            target: lzma2_mt_roundtrip
            encoder_seed: true
          - sanitizer: leak
            target: xz_mt_roundtrip
            encoder_seed: true
          - sanitizer: leak
            target: lzip_mt_roundtrip
            encoder_seed: true
          - sanitizer: memory
            target: lzma2_mt_decode
            decoder_seed: true
          - sanitizer: memory
            target: xz_mt_decode
            decoder_seed: true
          - sanitizer: memory
            target: lzip_mt_decode
            decoder_seed: true
          - sanitizer: memory
            target: lzma2
            decoder_seed: true
          - sanitizer: memory
            target: xz
            decoder_seed: true
          - sanitizer: memory
            target: lzip
            decoder_seed: true
          - sanitizer: thread
            target: lzma2_mt_decode
            decoder_seed: true
          - sanitizer: thread
            target: xz_mt_decode
            decoder_seed: true
          - sanitizer: thread
            target: lzip_mt_decode
            decoder_seed: true
          - sanitizer: thread
            target: lzma2_mt_roundtrip
            encoder_seed: true
          - sanitizer: thread
            target: xz_mt_roundtrip
            encoder_seed: true
          - sanitizer: thread
            target: lzip_mt_roundtrip
            encoder_seed: true
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          target: x86_64-unknown-linux-gnu
          components: rust-src
      - name: Select nightly Cargo
        run: echo "$(dirname "$(rustup which --toolchain nightly cargo)")" >> "$GITHUB_PATH"
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Seed decoder corpus
        if: matrix.decoder_seed
        run: cargo run --manifest-path fuzz/Cargo.toml --example seed_decoders
      - name: Seed encoder corpus
        if: matrix.encoder_seed
        run: cargo run --manifest-path fuzz/Cargo.toml --example seed_encoders
      - name: Run sanitizer fuzzing
        run: >-
          cargo fuzz run ${{ matrix.target }}
          --sanitizer ${{ matrix.sanitizer }}
          --build-std
          -- -max_total_time=30 -max_len=65548 -timeout=10 -rss_limit_mb=512

  tests:
    name: address / library tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          target: x86_64-unknown-linux-gnu
          components: rust-src
      - name: Select nightly Cargo
        run: echo "$(dirname "$(rustup which --toolchain nightly cargo)")" >> "$GITHUB_PATH"
      - name: Run AddressSanitizer tests
        env:
          RUSTFLAGS: -Zsanitizer=address
        run: cargo test -Zbuild-std --target x86_64-unknown-linux-gnu --lib --all-features

  miri:
    name: Miri (single-threaded core)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Select nightly Cargo
        run: echo "$(dirname "$(rustup which --toolchain nightly cargo)")" >> "$GITHUB_PATH"
      - name: Run Miri tests
        run: cargo miri test --lib --no-default-features --features std -- --skip reader_mt --skip work_queue --skip work_pool
